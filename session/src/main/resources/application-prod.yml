server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

voting:
  service:
    url: ${VOTING_SERVICE_URL:}

session:
  internal-token: ${SESSION_INTERNAL_TOKEN:change-me-internal}
